<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🧰 Manutenções - Delícia & Mercatto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
<style>
:root{
  --bg:#0b0f19;--card:#151d2f;--accent:#ff8f1f;--accent2:#ffb347;
  --text:#f8fafc;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;
  --shadow:0 4px 10px rgba(0,0,0,.4);
}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
header{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;text-align:center;padding:14px;font-weight:700;font-size:18px;
  box-shadow:0 3px 8px rgba(0,0,0,.4);
}
.container{max-width:850px;margin:auto;padding:16px;}
.section{
  background:var(--card);border-radius:16px;padding:18px;
  box-shadow:var(--shadow);margin-bottom:18px;
}
button{
  border:0;border-radius:8px;font-weight:600;cursor:pointer;
  padding:8px 12px;font-size:14px;
}
.btn-primary{background:var(--accent);color:#000;}
.btn-danger{background:var(--red);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-gray{background:#334155;color:#fff;}
.item{background:#1e293b;border-radius:10px;padding:12px;margin:6px 0;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#000;padding:10px 18px;border-radius:999px;
  font-weight:600;box-shadow:var(--shadow);display:none;z-index:9999;
}
.popup-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  z-index:10000;backdrop-filter:blur(2px);
}
.popup{
  background:#1e293b;border-radius:12px;padding:20px;
  max-width:420px;width:90%;box-shadow:0 4px 18px rgba(0,0,0,.6);
}
.popup textarea{
  width:100%;min-height:70px;margin-top:10px;border-radius:8px;
  border:1px solid #334155;background:#0f172a;color:#fff;padding:8px;
  resize:none;font-size:13px;
}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px;}
</style>
</head>
<body>
<header>🧰 Manutenções Programadas</header>

<div class="container">
  <div class="section" style="text-align:center">
    <h3 id="empresaTitulo"></h3>
    <p id="usuarioInfo" style="color:var(--muted);font-size:14px"></p>
    <input id="dataFiltro" type="text" class="input" placeholder="Selecione uma data">
  </div>

  <div class="section" id="listaManutencoes"><p>Carregando...</p></div>

  <div style="text-align:center;margin-top:20px">
    <button class="btn-primary" onclick="finalizarDia()">✅ Finalizar Dia</button>
  </div>

  <div style="text-align:center;margin-top:20px">
    <button class="btn-gray" onclick="voltar()">⬅ Voltar</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbymySoncD4zG-shT3qrsC9P-a62dXt5-9gXppQ5TsuEJvd0jHCTSXpBTu2k1YmljUry/exec';
const $=s=>document.querySelector(s);

let empresaAtual=localStorage.getItem('empresa')||'MERCATTO DELÍCIA';
let gerenteAtual=localStorage.getItem('gerente')||'Gerente';
$('#empresaTitulo').textContent=`Empresa: ${empresaAtual}`;
$('#usuarioInfo').textContent=`Gerente: ${gerenteAtual}`;

let manutencoes=[];

/* ================== INICIALIZA ================== */
flatpickr("#dataFiltro",{
  locale:"pt",dateFormat:"d/m/Y",defaultDate:new Date(),
  onChange:()=>filtrarPorData()
});

(async()=>{await carregar();setInterval(carregar,60000);})();

/* ================== CARREGAR ================== */
async function carregar(){
  try{
    const res=await fetch(`${GAS_URL}?action=manutencoes&empresa=${encodeURIComponent(empresaAtual)}`);
    manutencoes=await res.json()||[];
    filtrarPorData();
  }catch{toast('⚠️ Erro ao carregar.');}
}

function filtrarPorData(){
  const data=$('#dataFiltro').value||new Date().toLocaleDateString('pt-BR');
  const dia=new Date(data.split('/').reverse().join('-'));
  const filtradas=manutencoes.filter(m=>verificarAgendamento(m,dia));
  render(filtradas);
}

/* ================== LÓGICA DE FREQUÊNCIA ================== */
function verificarAgendamento(m,dia){
  const freq=(m.frequencia||'').toLowerCase();
  const dataItem=parseData(m.dataAgendada);
  if(!freq||freq==='única'||freq==='fixa')return mesmaData(dia,dataItem);
  if(freq.includes('diário'))return true;
  if(freq.includes('semanal'))return dia.getDay()===dataItem.getDay();
  if(freq.includes('quinzenal')){
    const diff=(dia-dataItem)/(1000*60*60*24);
    return diff>=0 && diff%15<1;
  }
  if(freq.includes('mensal')){
    const diaFixo=parseInt(freq.replace(/\D/g,''))||dataItem.getDate();
    return dia.getDate()===diaFixo;
  }
  return false;
}
function parseData(d){try{return new Date(d.split('/').reverse().join('-'));}catch{return new Date();}}
function mesmaData(a,b){return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();}

/* ================== RENDER ================== */
function render(lista){
  const box=$('#listaManutencoes');
  if(!lista.length){box.innerHTML='<p>Nenhuma manutenção para este dia.</p>';return;}
  box.innerHTML=lista.map(m=>`
    <div class="item">
      <div><b>${m.item}</b><br>
        <small>${m.detalhes||''}</small><br>
        <small>Responsável: ${m.responsavel||'-'}</small>
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;">
        <button class="btn-green" onclick="acao('${m.item}','Concluído')">✅</button>
        <button class="btn-primary" onclick="acao('${m.item}','Reagendar')">🔁</button>
        <button class="btn-danger" onclick="acao('${m.item}','Cancelado')">❌</button>
      </div>
    </div>`).join('');
}

/* ================== AÇÕES ================== */
function acao(item,acao){
  const p=document.createElement('div');
  p.className='popup-bg';
  p.innerHTML=`
  <div class="popup">
    <h3>${item}</h3>
    <p>${acao==='Concluído'?'Confirma conclusão?':'Informe justificativa ou nova data:'}</p>
    <textarea id="just" placeholder="Observação..."></textarea>
    <button onclick="registrar('${item}','${acao}')">${acao}</button>
    <button style="margin-top:6px" onclick="this.closest('.popup-bg').remove()">Fechar</button>
  </div>`;
  document.body.appendChild(p);
}

async function registrar(item,acao){
  const obs=document.getElementById('just').value.trim();
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      action:'registrarManutencao',
      empresa:empresaAtual,gerente:gerenteAtual,item,acao,observacao:obs
    })});
    toast(`✅ ${acao} registrado.`);
    document.querySelector('.popup-bg').remove();
    carregar();
  }catch{toast('Erro ao registrar.');}
}

/* ================== FINALIZAR DIA ================== */
async function finalizarDia(){
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      action:'finalizarManutencoes',
      empresa:empresaAtual,gerente:gerenteAtual
    })});
    toast('🎯 Dia finalizado.');
  }catch{toast('Erro ao finalizar.');}
}

/* ================== UTIL ================== */
function voltar(){window.location.href='index.html';}
function toast(msg){
  const el=$('#toast');
  el.textContent=msg;el.style.display='block';
  clearTimeout(el.timeout);el.timeout=setTimeout(()=>el.style.display='none',2000);
}
</script>
</body>
</html>
