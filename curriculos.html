<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Currículos • RH Grupo DV</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --accent:#2563eb;--accent2:#1e40af;--radius:14px;--shadow:0 6px 18px rgba(15,23,42,.08);
}
[data-theme="dark"]{
  --bg:#0b0e14;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--line:#1f2937;
  --shadow:0 6px 20px rgba(0,0,0,.45);
}
body{
  margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
}
header{
  display:flex;justify-content:space-between;align-items:center;padding:20px 24px;
  background:var(--card);box-shadow:var(--shadow);
}
h1{font-weight:800;font-size:1.4rem;margin:0;}
main{max-width:1100px;margin:24px auto;padding:0 16px;}
.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
input,select{
  padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:15px;
  background:transparent;color:inherit;outline:none;transition:.2s;
}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.2);}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600;}
.btn-accent{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;}
.btn-ghost{background:transparent;border:1px dashed var(--line);color:var(--text);}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);}
th{background:var(--bg);font-weight:700;font-size:.9rem;color:var(--muted);}
tr:hover td{background:rgba(37,99,235,.05);}
.count{margin-top:10px;font-size:.9rem;color:var(--muted);}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;}
.modal.show{display:flex;}
.modal-content{
  background:var(--card);border-radius:12px;width:90%;max-width:800px;max-height:85vh;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);}
.modal-header h2{font-size:1rem;margin:0;}
.modal-body{flex:1;overflow:auto;background:#000;}
iframe{width:100%;height:100%;border:0;}
.close{background:none;border:0;font-size:1.5rem;color:var(--muted);cursor:pointer;}
</style>
</head>
<body>
  <header>
    <h1>📂 Currículos Recebidos</h1>
    <button id="refresh" class="btn-ghost">🔄 Atualizar</button>
  </header>

  <main>
    <div class="filters">
      <input type="date" id="inicio" />
      <input type="date" id="fim" />
      <select id="filtroArea">
        <option value="">Todas as áreas</option>
      </select>
      <button id="filtrar" class="btn-accent">Filtrar</button>
    </div>

    <table id="tabela">
      <thead>
        <tr><th>Data</th><th>Nome</th><th>Idade</th><th>Área</th><th>Currículo</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="count" id="count">Carregando...</div>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitulo">Currículo</h2>
        <button class="close" id="fechar">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="iframeCurriculo"></iframe>
      </div>
    </div>
  </div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzaiHfgr3_t3w24ypURzZjIrD4XtAvsrx_d-A54YoCjzNWsamIuisIUYpDVujNKMo3F/exec";

const tabela = document.querySelector("#tabela tbody");
const count = document.querySelector("#count");
const filtroArea = document.querySelector("#filtroArea");

async function carregar(){
  count.textContent = "Carregando...";
  tabela.innerHTML = "";
  try{
    const res = await fetch(ENDPOINT + "?acao=listar");
    const data = await res.json();
    if(!Array.isArray(data)) throw new Error("Formato inválido.");

    // popula filtro de áreas
    const areas = [...new Set(data.map(r=>r[4]).filter(Boolean))];
    filtroArea.innerHTML = '<option value="">Todas as áreas</option>' + areas.map(a=>`<option>${a}</option>`).join('');

    exibir(data);
  }catch(e){
    count.textContent = "Erro ao carregar: " + e.message;
  }
}

function exibir(data){
  const inicio = document.querySelector("#inicio").value;
  const fim = document.querySelector("#fim").value;
  const area = filtroArea.value;

  let filtrados = data;
  if(inicio) filtrados = filtrados.filter(r=> new Date(r[1]) >= new Date(inicio));
  if(fim) filtrados = filtrados.filter(r=> new Date(r[1]) <= new Date(fim + "T23:59"));
  if(area) filtrados = filtrados.filter(r=> (r[4]||"").toLowerCase() === area.toLowerCase());

  tabela.innerHTML = filtrados.map(r=>{
    const link = r[5];
    const nome = r[2];
    const dt = r[1];
    const idade = r[3]||"-";
    const area = r[4]||"-";
    return `<tr>
      <td>${dt}</td>
      <td>${nome}</td>
      <td>${idade}</td>
      <td>${area}</td>
      <td><button class="btn-ghost" onclick="abrirModal('${link}','${nome}')">📄 Ver Currículo</button></td>
    </tr>`;
  }).join('');
  count.textContent = filtrados.length + " currículo(s) exibido(s)";
}

document.querySelector("#filtrar").addEventListener("click",()=>carregar());
document.querySelector("#refresh").addEventListener("click",()=>carregar());

// Modal
const modal = document.querySelector("#modal");
const iframe = document.querySelector("#iframeCurriculo");
const fechar = document.querySelector("#fechar");

function abrirModal(link, nome){
  document.querySelector("#modalTitulo").textContent = "Currículo - " + nome;
  iframe.src = link.replace("/view","/preview");
  modal.classList.add("show");
}
fechar.addEventListener("click", ()=>modal.classList.remove("show"));
modal.addEventListener("click", e=>{ if(e.target===modal) modal.classList.remove("show"); });

// Inicialização
window.addEventListener("DOMContentLoaded", carregar);
</script>
</body>
</html>
