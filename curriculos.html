<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Criação de Currículo • Mercatto Delícia</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--text:#0f172a;--muted:#64748b;
  --accent:#ff8f1f;--accent2:#ffb347;--shadow:0 8px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);font-family:'Inter',sans-serif;
  color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;
}
header{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;text-align:center;padding:18px 12px;font-weight:800;
  font-size:20px;width:100%;box-shadow:var(--shadow);
}
.container{
  width:100%;max-width:500px;margin:20px;padding:20px;background:var(--card);
  border-radius:16px;box-shadow:var(--shadow);
}
label{display:block;margin-top:12px;font-weight:600;}
input,textarea,select{
  width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;
  font-size:15px;margin-top:4px;
}
button{
  width:100%;padding:12px;border-radius:10px;border:0;
  font-weight:700;cursor:pointer;transition:.2s;
}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#000;}
.btn-primary:hover{opacity:.9;}
.preview{margin-top:25px;text-align:center;}
.preview button{margin-top:10px;background:#1e293b;color:#fff;}
.banner{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;text-align:center;font-weight:800;font-size:20px;padding:14px;border-radius:14px 14px 0 0;
}
.resume{
  background:#fff;width:100%;max-width:800px;margin:auto;
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow);
  display:none;flex-direction:column;
}
.resume header{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;text-align:center;padding:16px;font-weight:800;font-size:20px;
}
.resume-body{display:flex;flex-wrap:wrap;}
.resume-left,.resume-right{padding:20px;}
.resume-left{flex:1 1 35%;background:#f9fafb;}
.resume-right{flex:1 1 65%;}
.resume h3{margin:10px 0 6px;color:var(--accent2);text-transform:uppercase;font-size:14px;}
.resume ul{padding-left:18px;margin:6px 0;}
.resume p{margin:4px 0;}
.profile-img{
  width:120px;height:120px;border-radius:50%;object-fit:cover;
  margin:10px auto;display:block;border:3px solid var(--accent);
}
footer{text-align:center;color:var(--muted);font-size:13px;margin:20px;}
@media(max-width:600px){
  .resume-body{flex-direction:column;}
  .resume-left,.resume-right{flex:1 1 100%;}
}
</style>
</head>
<body>

<header>📄 Criador de Currículos</header>

<div class="container" id="formBox">
  <label>Nome completo *</label>
  <input id="nome" required>

  <label>Ocupação / Cargo</label>
  <input id="cargo">

  <label>Email *</label>
  <input id="email" type="email" required>

  <label>Telefone *</label>
  <input id="telefone" placeholder="+55 11 99999-9999" required>

  <label>Cidade / Estado</label>
  <input id="cidade">

  <label>LinkedIn</label>
  <input id="linkedin" placeholder="linkedin.com/in/usuario">

  <label>Objetivo</label>
  <textarea id="objetivo" rows="3"></textarea>

  <label>Habilidades (separadas por vírgula)</label>
  <input id="habilidades">

  <label>Idiomas</label>
  <input id="idiomas" placeholder="Ex: Português - Nativo, Inglês - Intermediário">

  <label>Experiências Profissionais</label>
  <textarea id="experiencia" rows="4" placeholder="Nome da empresa, cargo, atividades, datas..."></textarea>

  <label>Educação</label>
  <textarea id="educacao" rows="3" placeholder="Curso, instituição, cidade, datas..."></textarea>

  <label>Foto (opcional)</label>
  <input type="file" id="foto" accept="image/*">

  <button class="btn-primary" id="gerarBtn">🎨 Gerar Currículo</button>
</div>

<div class="preview" id="previewBox" style="display:none;">
  <div id="resumeView" class="resume"></div>
  <button id="baixarBtn">⬇️ Baixar Currículo (PDF)</button>
</div>

<footer>©2025 Grupo Delícia & Mercatto</footer>

<script>
const $=s=>document.querySelector(s);
const campos=['nome','cargo','email','telefone','cidade','linkedin','objetivo','habilidades','idiomas','experiencia','educacao'];
const storageKey='curriculoDV';

// Restaurar dados salvos
window.addEventListener('DOMContentLoaded',()=>{
  const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
  campos.forEach(c=>{ if(saved[c]) $('#'+c).value=saved[c]; });
});

// Salvar automaticamente
campos.forEach(id=>{
  $('#'+id).addEventListener('input',()=>{
    const data={};
    campos.forEach(c=>data[c]=$('#'+c).value);
    localStorage.setItem(storageKey,JSON.stringify(data));
  });
});

$('#gerarBtn').addEventListener('click',async()=>{
  const dados={};
  campos.forEach(c=>dados[c]=$('#'+c).value.trim());
  const file=$('#foto').files[0];
  let fotoURL='';
  if(file){
    fotoURL=await new Promise(res=>{
      const r=new FileReader();
      r.onload=()=>res(r.result);
      r.readAsDataURL(file);
    });
  }

  // Criação visual do currículo
  const html=`
  <div class="resume" id="cv">
    <header>${dados.nome||'Sem Nome'}</header>
    <div class="resume-body">
      <div class="resume-left">
        ${fotoURL?`<img src="${fotoURL}" class="profile-img">`:''}
        ${dados.email?`<h3>Contato</h3><p>${dados.email}</p>`:''}
        ${dados.telefone?`<p>${dados.telefone}</p>`:''}
        ${dados.cidade?`<p>${dados.cidade}</p>`:''}
        ${dados.linkedin?`<p>${dados.linkedin}</p>`:''}
        ${dados.objetivo?`<h3>Objetivo</h3><p>${dados.objetivo}</p>`:''}
        ${dados.habilidades?`<h3>Habilidades</h3><ul>${dados.habilidades.split(',').map(h=>`<li>${h.trim()}</li>`).join('')}</ul>`:''}
        ${dados.idiomas?`<h3>Idiomas</h3><p>${dados.idiomas}</p>`:''}
      </div>
      <div class="resume-right">
        ${dados.cargo?`<h3>${dados.cargo}</h3>`:''}
        ${dados.experiencia?`<h3>Experiência Profissional</h3><p>${dados.experiencia.replace(/\n/g,'<br>')}</p>`:''}
        ${dados.educacao?`<h3>Educação</h3><p>${dados.educacao.replace(/\n/g,'<br>')}</p>`:''}
      </div>
    </div>
  </div>`;
  
  $('#resumeView').innerHTML=html;
  $('#formBox').style.display='none';
  $('#previewBox').style.display='block';
  $('#resumeView').style.display='flex';
});

$('#baixarBtn').addEventListener('click',async()=>{
  const cv=document.querySelector('#cv');
  const { jsPDF } = window.jspdf;
  const canvas=await html2canvas(cv,{scale:2});
  const img=canvas.toDataURL('image/png');
  const pdf=new jsPDF('p','mm','a4');
  const w=pdf.internal.pageSize.getWidth();
  const h=(canvas.height*w)/canvas.width;
  pdf.addImage(img,'PNG',0,0,w,h);
  pdf.save('curriculo.pdf');
});
</script>
</body>
</html>
