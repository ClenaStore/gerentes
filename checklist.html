<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>✅ Check-list Diário</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f19;--card:#151d2f;--accent:#ff8f1f;--accent2:#ffb347;
  --text:#f8fafc;--muted:#94a3b8;--success:#22c55e;--error:#ef4444;
  --shadow:0 6px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;
}
header{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;text-align:center;padding:14px;font-weight:700;font-size:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);
}
.container{max-width:700px;margin:auto;padding:16px;width:100%;flex:1;}
.section{
  background:var(--card);border-radius:16px;padding:18px;
  box-shadow:var(--shadow);margin-bottom:18px;
}
.item{
  background:#1e293b;border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;
  margin:8px 0;transition:background .2s;
}
.done{color:var(--success);}
.btn{
  padding:8px 16px;border:0;border-radius:8px;font-weight:600;
  background:var(--accent);color:#000;cursor:pointer;
  box-shadow:var(--shadow);transition:.2s;font-size:14px;position:relative;
}
.btn.small{padding:6px 10px;font-size:13px;width:90px;}
.btn:hover{background:var(--accent2);transform:scale(1.03);}
.btn.loading{opacity:.6;pointer-events:none;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#000;padding:10px 20px;border-radius:999px;
  font-weight:600;box-shadow:var(--shadow);display:none;
}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px;}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:18px;z-index:9999;
}
</style>
</head>
<body>

<header>✅ Check-list Diário</header>

<div class="overlay" id="overlay">Carregando tarefas...</div>

<div class="container">
  <div class="section" style="text-align:center">
    <h3 id="empresaTitulo"></h3>
    <p id="usuarioInfo" style="color:var(--muted);font-size:14px"></p>
  </div>

  <div class="section" id="listaChecklist"></div>

  <div style="text-align:center;margin-top:20px">
    <button class="btn" onclick="concluirChecklist()">✅ Concluir Check-list</button>
  </div>

  <div style="text-align:center;margin-top:20px">
    <button class="btn" style="background:#334155;color:#fff" onclick="voltar()">⬅ Voltar</button>
  </div>

  <footer>©2025 Grupo Delícia & Mercatto</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw7L7EltP8gOCvTNhqOhmecicOohbZmznHYZXSzCFplW3GU096isvFu_nsfNl-fawoA/exec';
const $=s=>document.querySelector(s);

let fullLogin=localStorage.getItem('gerente') || 'MERCATTO DELÍCIA_GERENTE';
let empresaAtual='', gerenteAtual='';

/* === Extrai empresa e gerente === */
if(fullLogin.includes('_')){
  [empresaAtual,gerenteAtual]=fullLogin.split('_');
}else{
  empresaAtual='MERCATTO DELÍCIA';
  gerenteAtual=fullLogin;
}

$('#empresaTitulo').textContent=`Empresa: ${empresaAtual}`;
$('#usuarioInfo').textContent=`Responsável: ${gerenteAtual}`;

let checklist=[],historico=[],ultimoFechamento='';

/* === INÍCIO === */
window.onload=async()=>{await carregarDados();};

/* === CARREGAR CHECKLIST + HISTÓRICO === */
async function carregarDados(){
  $('#overlay').style.display='flex';
  try{
    const [resCheck,resHist]=await Promise.all([
      fetch(`${GAS_URL}?action=checklist&empresa=${encodeURIComponent(empresaAtual)}`),
      fetch(`${GAS_URL}?action=historico&empresa=${encodeURIComponent(empresaAtual)}`)
    ]);
    checklist=await resCheck.json();
    historico=await resHist.json();

    const fechamento=historico.filter(h=>h.divisor==='Sim');
    if(fechamento.length)ultimoFechamento=fechamento[fechamento.length-1].data;

    renderChecklist();
  }catch(e){
    $('#listaChecklist').innerHTML='<p>⚠️ Erro ao carregar tarefas.</p>';
  }finally{
    $('#overlay').style.display='none';
  }
}

/* === RENDER === */
function renderChecklist(){
  const box=$('#listaChecklist');
  if(!checklist.length){box.innerHTML='<p>Nenhuma tarefa cadastrada.</p>';return;}
  box.innerHTML='';
  checklist.forEach(t=>{
    const jaFeita=historico.some(h=>h.tarefa===t.tarefa && (!ultimoFechamento||h.data>ultimoFechamento));
    const btnClass=jaFeita?'background:var(--success);color:#fff':'';
    box.innerHTML+=`
      <div class="item">
        <div class="${jaFeita?'done':''}">${t.tarefa}</div>
        <button class="btn small" style="${btnClass}"
          onclick="${jaFeita?`mostrarHistorico('${t.tarefa}')`:`marcarFeito(this,'${t.tarefa}')`}">
          ${jaFeita?'✔ Feita':'Fazer'}
        </button>
      </div>`;
  });
}

/* === MARCAR FEITA === */
async function marcarFeito(btn,tarefa){
  btn.style.background='var(--success)';
  btn.style.color='#fff';
  btn.textContent='✔ Feita';
  btn.disabled=true;
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      action:'registrarHistorico',
      empresa:empresaAtual,
      gerente:gerenteAtual,
      tarefa:tarefa,
      status:`Feito`
    })});
    toast(`✅ ${tarefa} feita por ${gerenteAtual}`);
  }catch{
    toast('⚠️ Erro ao registrar tarefa');
  }
}

/* === MOSTRAR HISTÓRICO === */
function mostrarHistorico(tarefa){
  const registros=historico.filter(h=>h.tarefa===tarefa && (!ultimoFechamento||h.data>ultimoFechamento));
  let msg='Sem histórico recente.';
  if(registros.length){
    msg=registros.map(r=>`<p><b>${r.data}</b><br>${r.status}<br><small>Por: ${r.gerente}</small></p>`).join('<hr>');
  }
  alert(`📋 Histórico de "${tarefa}"\n\n${registros.map(r=>`${r.data} - ${r.gerente} - ${r.status}`).join('\n')||'Sem registros'}`);
}

/* === FINALIZAR === */
async function concluirChecklist(){
  const btn=event.target;
  btn.disabled=true;
  btn.textContent='Processando...';
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      action:'finalizarChecklist',
      empresa:empresaAtual,
      gerente:gerenteAtual
    })});
    toast(`🎯 Checklist finalizado por ${gerenteAtual}`);
    setTimeout(()=>window.location.reload(),1500);
  }catch{
    toast('⚠️ Erro ao finalizar checklist');
  }
}

/* === VOLTAR === */
function voltar(){window.location.href='index.html';}

/* === TOAST === */
function toast(msg){
  const el=$('#toast');
  el.textContent=msg;
  el.style.display='block';
  setTimeout(()=>el.style.display='none',2500);
}
</script>
</body>
</html>
