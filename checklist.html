<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>✅ Check-list Diário</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f19;--card:#151d2f;--accent:#ff8f1f;--accent2:#ffb347;
  --text:#f8fafc;--muted:#94a3b8;--success:#22c55e;--error:#ef4444;
  --shadow:0 4px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;font-family:'Inter',sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;display:flex;flex-direction:column;
}
header{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;text-align:center;padding:14px;font-weight:700;font-size:18px;
  box-shadow:0 3px 8px rgba(0,0,0,.4);
}
.container{max-width:650px;margin:auto;padding:16px;width:100%;flex:1;}
.section{
  background:var(--card);border-radius:16px;padding:18px;
  box-shadow:var(--shadow);margin-bottom:18px;
}
.item{
  background:#1e293b;border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  margin:6px 0;transition:background .15s;
}
.item:hover{background:#25334e;}
.done{color:var(--success);}
.btn{
  border:0;border-radius:8px;font-weight:600;
  background:var(--accent);color:#000;cursor:pointer;
  transition:.2s;font-size:13px;padding:6px 12px;min-width:90px;
}
.btn:hover{background:var(--accent2);}
.btn.small{font-size:13px;}
.btn.done{background:var(--success)!important;color:#fff!important;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#000;padding:10px 18px;border-radius:999px;
  font-weight:600;box-shadow:var(--shadow);display:none;z-index:9999;
}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px;}
.overlay{
  position:fixed;inset:0;background:#000d;
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:18px;z-index:9999;
}
/* ==== POPUP HISTÓRICO ==== */
.popup-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  z-index:10000;backdrop-filter:blur(2px);
}
.popup{
  background:#1e293b;border-radius:12px;padding:20px;max-width:380px;
  width:90%;box-shadow:0 4px 18px rgba(0,0,0,.6);
  color:#fff;font-family:Inter,sans-serif;
}
.popup h3{margin:0 0 10px;font-size:16px;color:#ffb347;text-align:center;}
.popup ul{margin:0;padding:0;list-style:none;max-height:300px;overflow-y:auto;}
.popup li{
  background:#2b3b55;padding:8px 10px;margin:6px 0;border-radius:8px;
  font-size:13px;line-height:1.4;
}
.popup li span{display:block;color:#94a3b8;font-size:12px;}
.popup button{
  background:#ff8f1f;border:0;border-radius:8px;color:#000;
  font-weight:600;padding:8px 14px;width:100%;margin-top:10px;
  cursor:pointer;
}
@media(max-width:480px){
  header{font-size:16px;padding:12px;}
  .btn{font-size:13px;padding:8px 12px;}
  .item{flex-direction:column;align-items:flex-start;gap:6px;}
  .btn{align-self:flex-end;}
}
</style>
</head>
<body>

<header>✅ Check-list Diário</header>

<div class="overlay" id="overlay">Carregando tarefas...</div>

<div class="container">
  <div class="section" style="text-align:center">
    <h3 id="empresaTitulo"></h3>
    <p id="usuarioInfo" style="color:var(--muted);font-size:14px"></p>
  </div>

  <div class="section" id="listaChecklist"></div>

  <div style="text-align:center;margin-top:20px">
    <button class="btn" id="btnConcluir" onclick="concluirChecklist()">✅ Concluir Check-list</button>
  </div>

  <div style="text-align:center;margin-top:20px">
    <button class="btn" style="background:#334155;color:#fff" onclick="voltar()">⬅ Voltar</button>
  </div>

  <footer>©2025 Grupo Delícia & Mercatto</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw7L7EltP8gOCvTNhqOhmecicOohbZmznHYZXSzCFplW3GU096isvFu_nsfNl-fawoA/exec';
const $=s=>document.querySelector(s);

let empresaAtual = localStorage.getItem('empresa') || 'MERCATTO DELÍCIA';
let gerenteAtual = localStorage.getItem('gerente') || 'Gerente';
$('#empresaTitulo').textContent=`Empresa: ${empresaAtual}`;
$('#usuarioInfo').textContent=`Gerente: ${gerenteAtual}`;

let checklistCache = [];
let historicoCache = [];
let ultimoUpdate = 0;

/* ==== INICIALIZAÇÃO ==== */
(async()=>{
  try{
    checklistCache = JSON.parse(localStorage.getItem('checklistCache')||'[]');
    historicoCache = JSON.parse(localStorage.getItem('historicoCache')||'[]');
    ultimoUpdate = parseInt(localStorage.getItem('lastUpdate')||0);

    renderChecklist();
    const precisaAtualizar = (Date.now()-ultimoUpdate)>3600000 || !checklistCache.length;
    if(precisaAtualizar) await atualizarEmSegundoPlano();
  }catch{toast('⚠️ Erro ao carregar cache.');}
  $('#overlay').style.display='none';
})();

/* ==== ATUALIZAÇÃO EM SEGUNDO PLANO ==== */
async function atualizarEmSegundoPlano(){
  try{
    const [res1,res2] = await Promise.all([
      fetch(`${GAS_URL}?action=checklist&empresa=${encodeURIComponent(empresaAtual)}`).then(r=>r.json()),
      fetch(`${GAS_URL}?action=historico&empresa=${encodeURIComponent(empresaAtual)}`).then(r=>r.json())
    ]);
    checklistCache=res1||[]; historicoCache=res2||[];
    localStorage.setItem('checklistCache',JSON.stringify(checklistCache));
    localStorage.setItem('historicoCache',JSON.stringify(historicoCache));
    localStorage.setItem('lastUpdate',Date.now());
    renderChecklist();
  }catch{toast('⚠️ Erro ao atualizar dados');}
}

/* ==== RENDERIZAÇÃO ==== */
function renderChecklist(){
  const box=$('#listaChecklist');
  if(!checklistCache.length){box.innerHTML='<p>Nenhuma tarefa cadastrada.</p>';return;}
  const histMap=new Set(historicoCache.filter(h=>h.status.includes('Feito')).map(h=>h.tarefa));
  const html=checklistCache.map(t=>{
    const feita=histMap.has(t.tarefa);
    return `
      <div class="item">
        <div class="${feita?'done':''}">${t.tarefa}</div>
        <button class="btn small ${feita?'done':''}"
          onclick="${feita?'mostrarHistorico(\''+t.tarefa+'\')':'marcarFeito(this,\''+t.tarefa+'\')'}">
          ${feita?'CONCLUÍDA':'Fazer'}
        </button>
      </div>`;
  }).join('');
  box.innerHTML=html;
}

/* ==== MARCAR FEITO ==== */
async function marcarFeito(btn,tarefa){
  btn.textContent='CONCLUÍDA';
  btn.classList.add('done');
  btn.disabled=true;
  const novo={tarefa,status:'Feito',gerente:gerenteAtual,data:new Date().toLocaleString()};
  historicoCache.push(novo);
  localStorage.setItem('historicoCache',JSON.stringify(historicoCache));
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      action:'registrarHistorico',
      empresa:empresaAtual,
      gerente:gerenteAtual,
      tarefa,
      status:'Feito'
    })});
  }catch{}
}

/* ==== MOSTRAR HISTÓRICO BONITO (FILTRO POR EMPRESA) ==== */
async function mostrarHistorico(tarefa){
  const overlay=$('#overlay');
  overlay.textContent='Carregando histórico...';
  overlay.style.display='flex';
  try{
    const res=await fetch(`${GAS_URL}?action=historico&empresa=${encodeURIComponent(empresaAtual)}`);
    const registros=await res.json();
    overlay.style.display='none';

    const hist=registros.filter(h=>h.tarefa===t.tarefa && h.empresa===empresaAtual);
    if(!hist.length)return toast('Sem registros anteriores.');

    const htmlItens=hist.map(h=>{
      const dataObj=new Date(h.data);
      const dataFormatada=`${String(dataObj.getDate()).padStart(2,'0')}/${String(dataObj.getMonth()+1).padStart(2,'0')}/${dataObj.getFullYear()} ${String(dataObj.getHours()).padStart(2,'0')}:${String(dataObj.getMinutes()).padStart(2,'0')}`;
      return `<li>
        <strong>${h.gerente||'—'}</strong> • ${h.status}
        <span>${h.empresa||''} • ${dataFormatada}</span>
      </li>`;
    }).join('');

    const popup=document.createElement('div');
    popup.className='popup-bg';
    popup.innerHTML=`
      <div class="popup">
        <h3>📋 Histórico - ${t.tarefa}</h3>
        <ul>${htmlItens}</ul>
        <button onclick="this.closest('.popup-bg').remove()">Fechar</button>
      </div>`;
    document.body.appendChild(popup);
  }catch(e){
    overlay.style.display='none';
    toast('⚠️ Erro ao carregar histórico.');
  }
}

/* ==== FINALIZAR ==== */
async function concluirChecklist(){
  const btn=$('#btnConcluir');
  btn.disabled=true; btn.textContent='Processando...';
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      action:'finalizarChecklist',
      empresa:empresaAtual,
      gerente:gerenteAtual
    })});
    historicoCache.push({
      tarefa:'--- FIM DO CHECKLIST ---',
      status:'Finalizado',
      gerente:gerenteAtual,
      empresa:empresaAtual,
      data:new Date().toLocaleString(),
      divisor:'Sim'
    });
    localStorage.setItem('historicoCache',JSON.stringify(historicoCache));
    toast(`🎯 Checklist finalizado por ${gerenteAtual}`);
    setTimeout(()=>{
      historicoCache=[];
      localStorage.setItem('historicoCache','[]');
      renderChecklist();
      toast('✅ Novo ciclo iniciado!');
      btn.disabled=false; btn.textContent='✅ Concluir Check-list';
    },1000);
  }catch{
    toast('⚠️ Erro ao finalizar checklist');
    btn.disabled=false; btn.textContent='✅ Concluir Check-list';
  }
}

/* ==== VOLTAR ==== */
function voltar(){window.location.href='index.html';}

/* ==== TOAST ==== */
function toast(msg){
  const el=$('#toast');
  el.textContent=msg;
  el.style.display='block';
  clearTimeout(el.timeout);
  el.timeout=setTimeout(()=>el.style.display='none',2000);
}

/* ==== BACKGROUND REFRESH ==== */
setInterval(atualizarEmSegundoPlano,3600000);
</script>
</body>
</html>
