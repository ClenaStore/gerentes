<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>✅ Check-list Diário</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f19;--card:#151d2f;--accent:#ff8f1f;--accent2:#ffb347;
  --text:#f8fafc;--muted:#94a3b8;--success:#22c55e;--error:#ef4444;
  --shadow:0 4px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;font-family:'Inter',sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;display:flex;flex-direction:column;
}
header{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;text-align:center;padding:14px;font-weight:700;font-size:18px;
  box-shadow:0 3px 8px rgba(0,0,0,.4);
}
.container{max-width:650px;margin:auto;padding:16px;width:100%;flex:1;}
.section{
  background:var(--card);border-radius:16px;padding:18px;
  box-shadow:var(--shadow);margin-bottom:18px;
}
.item{
  background:#1e293b;border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  margin:6px 0;transition:background .15s;
}
.item:hover{background:#25334e;}
.done{color:var(--success);}
.btn{
  border:0;border-radius:8px;font-weight:600;
  background:var(--accent);color:#000;cursor:pointer;
  transition:.2s;font-size:13px;padding:6px 12px;min-width:90px;
}
.btn:hover{background:var(--accent2);}
.btn.small{font-size:13px;}
.btn.done{background:var(--success)!important;color:#fff!important;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#000;padding:10px 18px;border-radius:999px;
  font-weight:600;box-shadow:var(--shadow);display:none;z-index:9999;
}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px;}
.overlay{
  position:fixed;inset:0;background:#000d;
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:18px;z-index:9999;
}
/* POPUP GENÉRICO */
.popup-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  z-index:10000;backdrop-filter:blur(2px);
}
.popup{
  background:#1e293b;border-radius:12px;padding:20px;max-width:420px;
  width:90%;box-shadow:0 4px 18px rgba(0,0,0,.6);
  color:#fff;font-family:Inter,sans-serif;
}
.popup h3{margin:0 0 10px;font-size:16px;color:#ffb347;text-align:center;}
.popup ul{margin:0;padding:0;list-style:none;max-height:320px;overflow-y:auto;}
.popup li{
  background:#2b3b55;padding:8px 10px;margin:6px 0;border-radius:8px;
  font-size:13px;line-height:1.4;
}
.popup li span{display:block;color:#94a3b8;font-size:12px;}
.popup button{
  background:#ff8f1f;border:0;border-radius:8px;color:#000;
  font-weight:600;padding:8px 14px;width:100%;margin-top:10px;
  cursor:pointer;
}
.popup textarea{
  width:100%;min-height:70px;margin-top:10px;border-radius:8px;
  border:1px solid #334155;background:#0f172a;color:#fff;padding:8px;
  resize:none;font-family:Inter,sans-serif;font-size:13px;
}
@media(max-width:480px){
  header{font-size:16px;padding:12px;}
  .btn{font-size:13px;padding:8px 12px;}
  .item{flex-direction:column;align-items:flex-start;gap:6px;}
  .btn{align-self:flex-end;}
}
</style>
</head>
<body>

<header>✅ Check-list Diário</header>

<div class="overlay" id="overlay">Carregando tarefas...</div>

<div class="container">
  <div class="section" style="text-align:center">
    <h3 id="empresaTitulo"></h3>
    <p id="usuarioInfo" style="color:var(--muted);font-size:14px"></p>
  </div>

  <div class="section" id="listaChecklist"></div>

  <div style="text-align:center;margin-top:20px">
    <button class="btn" id="btnConcluir" onclick="abrirResumo()">✅ Concluir Check-list</button>
  </div>

  <div style="text-align:center;margin-top:20px">
    <button class="btn" style="background:#334155;color:#fff" onclick="voltar()">⬅ Voltar</button>
  </div>

  <footer>©2025 Grupo Delícia & Mercatto</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw7L7EltP8gOCvTNhqOhmecicOohbZmznHYZXSzCFplW3GU096isvFu_nsfNl-fawoA/exec';
const $=s=>document.querySelector(s);

let empresaAtual = localStorage.getItem('empresa') || 'MERCATTO DELÍCIA';
let gerenteAtual = localStorage.getItem('gerente') || 'Gerente';
$('#empresaTitulo').textContent=`Empresa: ${empresaAtual}`;
$('#usuarioInfo').textContent=`Gerente: ${gerenteAtual}`;

let checklistCache = [];
let historicoFiltrado = [];
let pollTimer=null;

function fmt(d){
  const dt=new Date(d);
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

/* ======= Inicialização ======= */
(async()=>{ await carregarChecklist(true); startPolling(); })();

/* ======= Atualização automática ======= */
function startPolling(){
  clearInterval(pollTimer);
  pollTimer=setInterval(()=>carregarChecklist(false),60000);
}

/* ======= Carregar dados ======= */
async function carregarChecklist(showOverlay){
  if(showOverlay){$('#overlay').style.display='flex';}
  try{
    const [resC,resH] = await Promise.all([
      fetch(`${GAS_URL}?action=checklist&empresa=${encodeURIComponent(empresaAtual)}`),
      fetch(`${GAS_URL}?action=historico&empresa=${encodeURIComponent(empresaAtual)}`)
    ]);
    const checklist = await resC.json();
    const hist = await resH.json();
    const histEmp = hist.filter(h=>h.empresa===empresaAtual);
    const idx=histEmp.map(h=>h.tarefa).lastIndexOf('--- FIM DO CHECKLIST ---');
    historicoFiltrado = idx>=0?histEmp.slice(idx+1):histEmp;
    checklistCache = checklist||[];
    renderChecklist();
  }catch{toast('⚠️ Erro ao carregar dados.');}
  finally{$('#overlay').style.display='none';}
}

/* ======= Render ======= */
function renderChecklist(){
  const box=$('#listaChecklist');
  if(!checklistCache.length){box.innerHTML='<p>Nenhuma tarefa cadastrada.</p>';return;}
  const feitos = new Set(historicoFiltrado.filter(h=>String(h.status).toLowerCase().includes('feito')).map(h=>h.tarefa));
  box.innerHTML = checklistCache.map(t=>{
    const done = feitos.has(t.tarefa);
    return `<div class="item">
      <div class="${done?'done':''}">${t.tarefa}</div>
      <button class="btn small ${done?'done':''}" onclick="${done?'mostrarHistorico(\''+t.tarefa+'\')':'marcarFeito(this,\''+t.tarefa+'\')'}">
        ${done?'CONCLUÍDA':'Fazer'}
      </button>
    </div>`;
  }).join('');
}

/* ======= Marcar Feito ======= */
async function marcarFeito(btn,tarefa){
  btn.textContent='CONCLUÍDA';btn.classList.add('done');btn.disabled=true;
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      action:'registrarHistorico',empresa:empresaAtual,gerente:gerenteAtual,tarefa,status:'Feito'
    })});
    toast('✅ Concluída');
    await carregarChecklist(false);
  }catch{toast('⚠️ Erro ao registrar tarefa.');}
}

/* ======= Mostrar histórico ======= */
async function mostrarHistorico(tarefa){
  $('#overlay').textContent='Carregando histórico...';$('#overlay').style.display='flex';
  try{
    const res=await fetch(`${GAS_URL}?action=historico&empresa=${encodeURIComponent(empresaAtual)}`);
    const registros=await res.json();$('#overlay').style.display='none';
    const hist=registros.filter(h=>h.tarefa===tarefa && h.empresa===empresaAtual);
    if(!hist.length){toast('Sem registros.');return;}
    const html=hist.map(h=>`<li><strong>${h.gerente}</strong> • ${h.status}<span>${h.empresa} • ${fmt(h.data)}</span></li>`).join('');
    const pop=document.createElement('div');
    pop.className='popup-bg';
    pop.innerHTML=`<div class="popup"><h3>📋 Histórico – ${tarefa}</h3><ul>${html}</ul><button onclick="this.closest('.popup-bg').remove()">Fechar</button></div>`;
    document.body.appendChild(pop);
  }catch{$('#overlay').style.display='none';toast('Erro ao carregar histórico.');}
}

/* ======= Resumo antes de concluir ======= */
function abrirResumo(){
  const total=checklistCache.length;
  const feitos=new Set(historicoFiltrado.filter(h=>String(h.status).toLowerCase().includes('feito')).map(h=>h.tarefa));
  const concluidas=feitos.size;
  const faltam=total-concluidas;
  const pop=document.createElement('div');
  pop.className='popup-bg';
  pop.innerHTML=`
    <div class="popup">
      <h3>📊 Resumo do Dia</h3>
      <ul>
        <li><strong>Total de tarefas:</strong> ${total}</li>
        <li><strong>Concluídas:</strong> ${concluidas}</li>
        <li><strong>Faltando:</strong> ${faltam}</li>
      </ul>
      <textarea id="justificativa" placeholder="Justificativa (opcional, se faltaram tarefas)"></textarea>
      <button onclick="confirmarConclusao(this)">Confirmar Conclusão</button>
      <button style="background:#334155;color:#fff" onclick="this.closest('.popup-bg').remove()">Cancelar</button>
    </div>`;
  document.body.appendChild(pop);
}

/* ======= Confirmar Conclusão ======= */
async function confirmarConclusao(btn){
  const justificativa=document.getElementById('justificativa').value.trim();
  btn.disabled=true;btn.textContent='Processando...';
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      action:'finalizarChecklist',empresa:empresaAtual,gerente:gerenteAtual,justificativa
    })});
    toast(`🎯 Checklist finalizado por ${gerenteAtual}`);
    btn.closest('.popup-bg').remove();
    await carregarChecklist(true);
  }catch{
    toast('⚠️ Erro ao finalizar.');
    btn.disabled=false;btn.textContent='Confirmar Conclusão';
  }
}

/* ======= Diversos ======= */
function voltar(){window.location.href='index.html';}
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.style.display='block';
  clearTimeout(el.timeout);el.timeout=setTimeout(()=>el.style.display='none',2000);
}
</script>
</body>
</html>
